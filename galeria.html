<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotos do Anivers&aacute;rio - 70 Anos de Denise</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            min-height: 100vh;
            background: #0a0a0a;
            color: #fff;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(180deg, #1a1a2e 0%, #0a0a0a 100%);
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            font-size: 16px;
            font-family: 'Georgia', serif;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            color: #fff;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
            z-index: 100;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        h1 {
            font-size: 3vw;
            font-weight: normal;
            letter-spacing: 3px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #f5af19, #f12711);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitulo {
            font-size: 1.5vw;
            font-style: italic;
            color: #ccc;
            margin-bottom: 10px;
        }

        .contador {
            font-size: 1vw;
            color: rgba(255, 255, 255, 0.5);
        }

        .galeria {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            padding: 30px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .foto-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            background: #1a1a1a;
        }

        .foto-item:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 40px rgba(245, 175, 25, 0.3);
        }

        .foto-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .foto-item:hover img {
            transform: scale(1.1);
        }

        .lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
            border-radius: 5px;
            animation: zoomIn 0.3s ease-out;
        }

        @keyframes zoomIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: #fff;
            cursor: pointer;
            transition: color 0.3s;
        }

        .lightbox-close:hover {
            color: #f5af19;
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 50px;
            color: #fff;
            cursor: pointer;
            padding: 20px;
            transition: color 0.3s;
        }

        .lightbox-nav:hover {
            color: #f5af19;
        }

        .lightbox-prev {
            left: 10px;
        }

        .lightbox-next {
            right: 10px;
        }

        .footer {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.4);
            font-style: italic;
        }

        @media (max-width: 768px) {
            header { padding: 30px 15px; }
            h1 { font-size: clamp(20px, 6vw, 36px); }
            .subtitulo { font-size: clamp(12px, 3vw, 18px); }
            .contador { font-size: 12px; }
            .back-btn { padding: 8px 16px; font-size: 14px; top: 15px; left: 15px; }
            .galeria { 
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
                padding: 15px;
            }
            .foto-item { border-radius: 6px; }
            .lightbox-nav { font-size: 36px; padding: 15px; }
            .lightbox-close { font-size: 32px; top: 15px; right: 20px; }
        }

        @media (max-width: 480px) {
            header { padding: 25px 10px; }
            h1 { font-size: clamp(18px, 7vw, 28px); }
            .subtitulo { font-size: 12px; }
            .galeria { 
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
                padding: 10px;
            }
            .lightbox-nav { font-size: 28px; padding: 10px; }
            .lightbox-prev { left: 5px; }
            .lightbox-next { right: 5px; }
            .footer { padding: 30px 15px; font-size: 13px; }
        }
    </style>
</head>

        const pasta = "fotos/Pos_aniversario/";
        let indiceAtual = 0;

        function criarGaleria() {
            const galeria = document.getElementById('galeria');
            document.querySelector('.contador').textContent = `${fotos.length} fotos da festa`;
            
            fotos.forEach((foto, index) => {
                const item = document.createElement('div');
                item.className = 'foto-item';
                item.innerHTML = `<img src="${pasta + foto}" alt="Foto ${index + 1}" loading="lazy">`;
                item.addEventListener('click', () => abrirLightbox(index));
                galeria.appendChild(item);
            });
        }

        function abrirLightbox(index) {
            indiceAtual = index;
            const lightbox = document.getElementById('lightbox');
            const img = document.getElementById('lightboxImg');
            img.src = pasta + fotos[indiceAtual];
            lightbox.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function fecharLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = 'auto';
        }

        function navegar(direcao) {
            indiceAtual += direcao;
            if (indiceAtual < 0) indiceAtual = fotos.length - 1;
            if (indiceAtual >= fotos.length) indiceAtual = 0;
            document.getElementById('lightboxImg').src = pasta + fotos[indiceAtual];
        }

        document.getElementById('lightboxClose').addEventListener('click', fecharLightbox);
        document.getElementById('lightboxPrev').addEventListener('click', () => navegar(-1));
        document.getElementById('lightboxNext').addEventListener('click', () => navegar(1));

        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target === document.getElementById('lightbox')) {
                fecharLightbox();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('lightbox').classList.contains('active')) return;
            if (e.key === 'Escape') fecharLightbox();
            if (e.key === 'ArrowLeft') navegar(-1);
            if (e.key === 'ArrowRight') navegar(1);
        });

        criarGaleria();
    </script>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>70 Anos de Denise</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            min-height: 100vh;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 800px;
            width: 100%;
        }

        .foto-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 40px;
            border-radius: 50%;
            padding: 8px;
            background: linear-gradient(135deg, #f5af19, #f12711);
            box-shadow: 0 0 60px rgba(245, 175, 25, 0.4);
            animation: glowPulse 3s ease-in-out infinite;
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 40px rgba(245, 175, 25, 0.3); }
            50% { box-shadow: 0 0 80px rgba(245, 175, 25, 0.6), 0 0 100px rgba(241, 39, 17, 0.3); }
        }

        .foto-container::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            border-radius: 50%;
            background: #0a0a0a;
            z-index: 0;
        }

        .foto-perfil {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            animation: fadeIn 1.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .numero-setenta {
            font-size: 12vw;
            font-weight: bold;
            color: transparent;
            background: linear-gradient(135deg, #f5af19, #f12711);
            -webkit-background-clip: text;
            background-clip: text;
            margin-bottom: 10px;
            animation: pulse 2s ease-in-out infinite;
            line-height: 1;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        h1 {
            font-size: 4vw;
            font-weight: normal;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .subtitulo {
            font-size: 1.8vw;
            font-style: italic;
            color: #ccc;
            margin-bottom: 50px;
        }

        .botoes {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 30px 50px;
            font-size: 1.2vw;
            font-family: 'Georgia', serif;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            color: #fff;
            cursor: pointer;
            transition: all 0.4s ease;
            text-decoration: none;
            min-width: 250px;
        }

        .btn:hover {
            transform: translateY(-5px);
            border-color: #f5af19;
            box-shadow: 0 10px 40px rgba(245, 175, 25, 0.3);
        }

        .btn-icon {
            font-size: 4vw;
        }

        .btn-video {
            background: linear-gradient(135deg, rgba(245, 175, 25, 0.2), rgba(241, 39, 17, 0.2));
        }

        .btn-video:hover {
            background: linear-gradient(135deg, rgba(245, 175, 25, 0.4), rgba(241, 39, 17, 0.4));
        }

        .btn-fotos {
            background: linear-gradient(135deg, rgba(100, 149, 237, 0.2), rgba(72, 61, 139, 0.2));
        }

        .btn-fotos:hover {
            background: linear-gradient(135deg, rgba(100, 149, 237, 0.4), rgba(72, 61, 139, 0.4));
            border-color: #6495ED;
            box-shadow: 0 10px 40px rgba(100, 149, 237, 0.3);
        }

        .footer {
            margin-top: 60px;
            font-size: 1vw;
            color: rgba(255, 255, 255, 0.4);
            font-style: italic;
        }

        .coracoes {
            margin-top: 30px;
            font-size: 2vw;
            animation: heartbeat 1.5s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.1); }
            50% { transform: scale(1); }
            75% { transform: scale(1.1); }
        }

        @media (max-width: 768px) {
            .foto-container { width: 180px; height: 180px; margin-bottom: 30px; }
            .numero-setenta { font-size: clamp(60px, 20vw, 120px); }
            h1 { font-size: clamp(24px, 8vw, 48px); }
            .subtitulo { font-size: clamp(14px, 4vw, 24px); margin-bottom: 30px; }
            .botoes { flex-direction: column; align-items: center; gap: 20px; }
            .btn { width: 100%; max-width: 280px; padding: 20px 30px; font-size: 16px; min-width: auto; }
            .btn-icon { font-size: 32px; }
            .coracoes { font-size: clamp(16px, 5vw, 28px); margin-top: 20px; }
            .footer { font-size: 12px; margin-top: 40px; }
        }

        @media (max-width: 480px) {
            body { padding: 15px; }
            .foto-container { width: 150px; height: 150px; margin-bottom: 25px; }
            .numero-setenta { font-size: clamp(50px, 22vw, 100px); }
            h1 { font-size: clamp(20px, 9vw, 40px); letter-spacing: 1px; }
            .subtitulo { font-size: clamp(12px, 4.5vw, 18px); }
            .btn { padding: 18px 25px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="foto-container">
            <img src="fotos/Pos_aniversario/foto_Sozinha_32_Copia.jpg" alt="Denise" class="foto-perfil">
        </div>

        <div class="numero-setenta">70</div>
        <h1>Anos de Denise</h1>
        <p class="subtitulo">Uma vida repleta de amor, alegria e momentos inesquecíveis</p>

        <div class="botoes">
            <a href="apresentacao.html" class="btn btn-video">
                <span class="btn-icon">🎬</span>
                <span>Vídeo de Apresentação</span>
            </a>
            <a href="galeria.html" class="btn btn-fotos">
                <span class="btn-icon">📸</span>
                <span>Fotos do Aniversário</span>
            </a>
        </div>

        <div class="coracoes">❤ ❤ ❤</div>

        <p class="footer">Feito com amor para a nossa querida Denise</p>
    </div>
</body>
</html>
